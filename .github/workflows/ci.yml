# Every pull request and every push to main must pass all of this (see CLAUDE.md).
# Tags like v1.2.3 also publish the server image to ghcr.io (deploy only those images), and put the Windows downloads
# on the tag's GitHub release, a draft until the owner publishes it.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --diff .  # fails, showing the fix, if anything needs formatting
      - run: uv run pytest

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # The client tests run against the real server.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
        working-directory: server
      - run: dotnet restore --locked-mode
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release
      # The add-in's Update runs only an installer signed with the key it carries (docs/deploying.md, "Signing key"),
      # so builds of main are signed here, and a release tag's in the release job. Never pull requests': their code
      # runs in this job too.
      - name: Sign Vault-Setup.exe
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          INSTALLER_SIGNING_KEY: ${{ secrets.INSTALLER_SIGNING_KEY }}
        run: bash ../.github/sign-installer.sh
      # Builds of main are kept as artifacts for 3 days, to try on a laptop before a release (over a weekend), and a
      # pull request's not at all: nobody installs those. Artifacts count against the account's storage (500 MB on
      # the free plan, metered by the hour), which GitHub blocks for the rest of the month once it's used up, so main
      # keeps only the add-in (3 MB, where vault.exe is 30 MB: that's on releases). Then even 35 merges in a week use
      # about a tenth of it. If it runs out anyway, the upload fails but the run doesn't: the build is still good.
      # Vault-Setup.exe installs the add-in on a Windows PC with SolidWorks 2026: put it in the server's
      # YJSP_DOWNLOADS_DIR, with its signature, Vault-Setup.exe.sig, and the web app offers it to members.
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          name: vault-setup
          path: |
            client/src/Vault.Setup/bin/Release/net48/Vault-Setup.exe
            client/src/Vault.Setup/bin/Release/net48/Vault-Setup.exe.sig
          if-no-files-found: error
          retention-days: 3
      # The add-in's files as they are, to install by hand with install.ps1 (see its README).
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          name: vault-solidworks-addin
          path: client/src/Vault.SolidWorks/bin/Release/net48/
          if-no-files-found: error
          retention-days: 3
      # One self-contained vault.exe: runs on Windows without installing .NET. Built here too, so a change that
      # breaks it fails its pull request, not the next release.
      - run: >-
          dotnet publish src/Vault.Cli --no-restore --configuration Release --runtime win-x64
          --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          --output ${{ runner.temp }}/vault-windows

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The web app's tests run against the real server.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
        working-directory: server
      - run: npm ci
      - run: npm run check  # types, and Prettier's formatting
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [server, client, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build --tag yjsp-server:ci --file server/Dockerfile .
      - name: Smoke test
        run: |
          docker run -d --name yjsp -p 127.0.0.1:8000:8000 -e YJSP_DEV_AUTH=1 yjsp-server:ci
          curl -sf --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/healthz
          docker rm -f yjsp
      - name: Publish (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yjsp-server"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag yjsp-server:ci "$image:${GITHUB_REF_NAME}"
          docker push "$image:${GITHUB_REF_NAME}"

  # A release tag's Windows downloads go on the tag's GitHub release, for an admin to put in the server's downloads
  # folder (docs/deploying.md, "New downloads"): Vault-Setup.exe with its signature, and vault.exe. Not as artifacts:
  # those count against the account's artifact storage, which GitHub blocks once a month's is used, and a release's
  # files don't, and stay as long as the release does.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [server, client, web]
    # The only job that can write to the repository, and it runs only for release tags: it makes the release.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Built as the client job builds them, from the commit it tested: without artifacts, files don't pass between
      # jobs.
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore --configuration Release
      - run: >-
          dotnet publish src/Vault.Cli --no-restore --configuration Release --runtime win-x64
          --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          --output ${{ runner.temp }}/vault-windows
      # Unsigned, laptops would refuse it as an update, so a release without the key fails here.
      - name: Sign Vault-Setup.exe
        env:
          INSTALLER_SIGNING_KEY: ${{ secrets.INSTALLER_SIGNING_KEY }}
        run: bash ../.github/sign-installer.sh --required
      # Onto the tag's release: a new draft, for the owner to write the notes in and publish, or the release that's
      # there already (one made by hand, or by an earlier try of this run), whose files are replaced.
      - name: Upload to the tag's release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          # The last try is for a release someone made while this one was being made.
          gh release view "$tag" > /dev/null 2>&1 \
            || gh release create "$tag" --draft --verify-tag --title "YJSP ${tag#v}" --notes "" \
            || gh release view "$tag" > /dev/null
          gh release upload "$tag" --clobber \
            src/Vault.Setup/bin/Release/net48/Vault-Setup.exe \
            src/Vault.Setup/bin/Release/net48/Vault-Setup.exe.sig \
            "$RUNNER_TEMP/vault-windows/vault.exe"
