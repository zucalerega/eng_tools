# Every pull request and every push to main must pass all of this (see CLAUDE.md).
# Tags like v1.2.3 also publish the server image to ghcr.io; deploy only those images.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --diff .  # fails, showing the fix, if anything needs formatting
      - run: uv run pytest

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # The client tests run against the real server.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
        working-directory: server
      - run: dotnet restore --locked-mode
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release
      # Vault-Setup.exe installs the add-in on a Windows PC with SolidWorks 2025: put it in the server's
      # YJSP_DOWNLOADS_DIR, and the web app offers it to members.
      - uses: actions/upload-artifact@v7
        with:
          name: vault-setup
          path: client/src/Cvc.Setup/bin/Release/net48/Vault-Setup.exe
          if-no-files-found: error
      # The add-in's files as they are, to install by hand with install.ps1 (see its README).
      - uses: actions/upload-artifact@v7
        with:
          name: cvc-solidworks-addin
          path: client/src/Cvc.SolidWorks/bin/Release/net48/
          if-no-files-found: error
      # One self-contained cvc.exe: runs on Windows without installing .NET.
      - run: >-
          dotnet publish src/Cvc.Cli --no-restore --configuration Release --runtime win-x64
          --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          --output ${{ runner.temp }}/cvc-windows
      - uses: actions/upload-artifact@v7
        with:
          name: cvc-windows
          path: ${{ runner.temp }}/cvc-windows/cvc.exe
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The web app's tests run against the real server.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
        working-directory: server
      - run: npm ci
      - run: npm run check  # types, and Prettier's formatting
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [server, client, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build --tag yjsp-server:ci --file server/Dockerfile .
      - name: Smoke test
        run: |
          docker run -d --name yjsp -p 127.0.0.1:8000:8000 -e YJSP_DEV_AUTH=1 yjsp-server:ci
          curl -sf --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/healthz
          docker rm -f yjsp
      - name: Publish (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yjsp-server"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag yjsp-server:ci "$image:${GITHUB_REF_NAME}"
          docker push "$image:${GITHUB_REF_NAME}"
