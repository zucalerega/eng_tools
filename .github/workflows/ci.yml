# Every pull request and every push to main must pass all of this (see CLAUDE.md).
# Tags like v1.2.3 also publish the server image to ghcr.io; deploy only those images.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --diff .  # fails, showing the fix, if anything needs formatting
      - run: uv run pytest

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # The client tests run against the real server.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
        working-directory: server
      - run: dotnet restore --locked-mode
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release

  image:
    runs-on: ubuntu-latest
    needs: [server, client]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build --tag cvc-server:ci server
      - name: Smoke test
        run: |
          docker run -d --name cvc -p 127.0.0.1:8000:8000 -e CVC_DEV_AUTH=1 cvc-server:ci
          curl -sf --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/healthz
          docker rm -f cvc
      - name: Publish (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cvc-server"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag cvc-server:ci "$image:${GITHUB_REF_NAME}"
          docker push "$image:${GITHUB_REF_NAME}"
