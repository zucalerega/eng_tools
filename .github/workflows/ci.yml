# Every pull request and every push to main must pass all of this (see CLAUDE.md).
# Tags like v1.2.3 also publish the server image to ghcr.io; deploy only those images.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --diff .  # fails, showing the fix, if anything needs formatting
      - run: uv run pytest

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # The client tests run against the real server.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
        working-directory: server
      - run: dotnet restore --locked-mode
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release
      # The add-in's Update runs only an installer signed with the key it carries (docs/deploying.md, "Signing key"),
      # so builds of main and release tags are signed. Never pull requests': their code runs in this job too.
      - name: Sign Vault-Setup.exe
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          INSTALLER_SIGNING_KEY: ${{ secrets.INSTALLER_SIGNING_KEY }}
        run: |
          if [ -z "$INSTALLER_SIGNING_KEY" ]; then
            echo "::warning::INSTALLER_SIGNING_KEY isn't set, so Vault-Setup.exe isn't signed, and add-ins won't update to it."
            exit 0
          fi
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          chmod 600 "$key"
          printf '%s\n' "$INSTALLER_SIGNING_KEY" > "$key"
          setup=src/Vault.Setup/bin/Release/net48/Vault-Setup.exe
          openssl dgst -sha256 -sign "$key" -out "$setup.sig" "$setup"
          # Laptops check it with the key their add-in carries. Signed with another, it's right only for the release
          # that brings a new key, which is signed with the old one.
          if ! openssl dgst -sha256 -verify src/Vault.Client/installer-signing.pub.pem -signature "$setup.sig" "$setup"; then
            echo "::warning::Vault-Setup.exe is signed with a key this add-in doesn't carry (installer-signing.pub.pem): add-ins won't update to it, unless it's the release that changes keys."
          fi
      # The builds are kept from main and from release tags only, main's for a week and a tag's for 90 days:
      # only those go on the server (docs/deploying.md), and a pull request's would fill the account's
      # artifact storage (500 MB) with copies nobody installs. Pull requests still build and test all of it.
      # Vault-Setup.exe installs the add-in on a Windows PC with SolidWorks 2026: put it in the server's
      # YJSP_DOWNLOADS_DIR, with its signature, Vault-Setup.exe.sig, and the web app offers it to members.
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: vault-setup
          path: |
            client/src/Vault.Setup/bin/Release/net48/Vault-Setup.exe
            client/src/Vault.Setup/bin/Release/net48/Vault-Setup.exe.sig
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 7 }}
      # The add-in's files as they are, to install by hand with install.ps1 (see its README).
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: vault-solidworks-addin
          path: client/src/Vault.SolidWorks/bin/Release/net48/
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 7 }}
      # One self-contained vault.exe: runs on Windows without installing .NET.
      - run: >-
          dotnet publish src/Vault.Cli --no-restore --configuration Release --runtime win-x64
          --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          --output ${{ runner.temp }}/vault-windows
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: vault-windows
          path: ${{ runner.temp }}/vault-windows/vault.exe
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 7 }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The web app's tests run against the real server.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
        working-directory: server
      - run: npm ci
      - run: npm run check  # types, and Prettier's formatting
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [server, client, web]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build --tag yjsp-server:ci --file server/Dockerfile .
      - name: Smoke test
        run: |
          docker run -d --name yjsp -p 127.0.0.1:8000:8000 -e YJSP_DEV_AUTH=1 yjsp-server:ci
          curl -sf --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/healthz
          docker rm -f yjsp
      - name: Publish (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yjsp-server"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag yjsp-server:ci "$image:${GITHUB_REF_NAME}"
          docker push "$image:${GITHUB_REF_NAME}"
