# Used only for generating migrations (uv run alembic revision --autogenerate -m "...").
# The server applies migrations itself at startup. The database comes from YJSP_DATABASE_URL.
[alembic]
script_location = src/yjsp_server/migrations
file_template = %%(rev)s_%%(slug)s

# Format each new migration with ruff, so a generated file passes CI as is.
[post_write_hooks]
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
