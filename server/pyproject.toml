[project]
name = "yjsp-server"
version = "0.5.1"
description = "YJSP server: the team's site, with Vault (CAD version control) and Yorg (test data)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "authlib>=1.3",
    "fastapi>=0.115",
    "fullflow[thermo]>=2.0.3",
    "httpx2>=2.13",
    "itsdangerous>=2.2",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
yjsp-server = "yjsp_server.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yjsp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501", # line length: the formatter handles it
]

[tool.ruff.lint.isort]
known-first-party = ["yjsp_server"]
